name: Apply v0.16.1 Play Protect hotfix

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/hotfix-v0161-play-protect.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove native converter from Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Build without NDK/native code. This isolates the Play Protect warning
          # first seen when the v0.16 C++ conversion engine was added.
          replace_once(
              "app/build.gradle.kts",
              '    ndkVersion = "27.0.12077973"\n',
              ''
          )
          replace_once(
              "app/build.gradle.kts",
              '        versionCode = 18\n        versionName = "0.16"\n\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }\n',
              '        versionCode = 19\n        versionName = "0.16.1"\n'
          )
          replace_once(
              "app/build.gradle.kts",
              '    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n            version = "3.22.1"\n        }\n    }\n\n',
              ''
          )

          # Keep native Evo transfer and pure-Kotlin image conversion, but pause
          # legacy TI conversion until it can be reintroduced without the native
          # engine that appears to trigger Play Protect heuristics.
          replace_once(
              "app/src/main/java/com/tijack/evo/MainActivity.kt",
              '                        val action = when {\n                            EvoImageConverter.canConvertFilename(fileName) -> "CONVERTING IMAGE"\n                            LegacyTiConverter.canConvertFilename(fileName) -> "CONVERTING"\n                            else -> "READING"\n                        }\n',
              '                        val action = if (EvoImageConverter.canConvertFilename(fileName)) {\n                            "CONVERTING IMAGE"\n                        } else {\n                            "READING"\n                        }\n'
          )
          replace_once(
              "app/src/main/java/com/tijack/evo/MainActivity.kt",
              '            LegacyTiConverter.canConvertFilename(name) ->\n                LegacyTiConverter.convertToEvo(raw, name, cacheDir, smart = true)\n',
              ''
          )
          replace_once(
              "app/src/main/java/com/tijack/evo/MainActivity.kt",
              '    private fun isTransferableFilename(name: String): Boolean =\n        isNativeEvoFilename(name) ||\n            LegacyTiConverter.canConvertFilename(name) ||\n            EvoImageConverter.canConvertFilename(name)\n',
              '    private fun isTransferableFilename(name: String): Boolean =\n        isNativeEvoFilename(name) || EvoImageConverter.canConvertFilename(name)\n'
          )
          replace_once(
              "app/src/main/java/com/tijack/evo/MainActivity.kt",
              '        LegacyTiConverter.canConvertFilename(name) -> "CONVERT"\n',
              ''
          )

          # Help text reflects what this hotfix actually ships.
          replace_once(
              "app/src/main/java/com/tijack/evo/HelpButton.kt",
              '        Legacy TI conversion: tivars_lib_cpp by Adrien Bertrand\n',
              ''
          )
          replace_once(
              "app/src/main/java/com/tijack/evo/HelpButton.kt",
              '        • Older TI-84 variable files such as .8xp are converted to Evo format before transfer when compatible.\n',
              '        • Legacy TI-84 conversion such as .8xp is temporarily paused in v0.16.1 while we replace the native converter that triggered a Play Protect warning.\n'
          )
          replace_once(
              "app/src/main/java/com/tijack/evo/HelpButton.kt",
              '        • Converted programs should be tested before classroom use because an older program can contain commands the Evo handles differently.\n',
              ''
          )

          # Artifact/version naming.
          replace_once(
              ".github/workflows/build-debug-apk.yml",
              '          name: TI-JACK-Evo-Android-v0.16\n',
              '          name: TI-JACK-Evo-Android-v0.16.1\n'
          )

          # README: make the Play Protect response explicit and avoid claiming
          # legacy conversion is available in the current artifact.
          p = Path("README.md")
          text = p.read_text()
          text = text.replace('## Current status — Android v0.16', '## Current status — Android v0.16.1')
          text = text.replace('| Legacy TI variable conversion (`.8xp`, lists, matrices, etc.) | Working through bundled `tivars_lib_cpp` |', '| Legacy TI variable conversion (`.8xp`, lists, matrices, etc.) | Temporarily paused in v0.16.1 while the native converter is replaced |')
          text = text.replace('Older compatible TI variable files are converted locally on the phone to Evo format before upload. The conversion engine is a pinned Evo-capable build of the MIT-licensed `tivars_lib_cpp`; TI-JACK validates the converted file with its Evo parser before it is allowed onto the USB transfer path.', 'v0.16 briefly shipped a native C++ legacy-file converter. A Samsung/Google Play Protect scan then classified that APK as harmful even though the app manifest declares no SMS, call-log, microphone, camera, contacts, broad-storage, or Internet permissions. v0.16.1 removes the native converter from the APK while that false-positive path is investigated. Native Evo transfer and image conversion remain available.')
          text = text.replace('TI-JACK-Evo-Android-v0.16', 'TI-JACK-Evo-Android-v0.16.1')
          p.write_text(text)

          # Third-party notices: tivars_lib_cpp is no longer bundled in current APK.
          Path("THIRD_PARTY_NOTICES.md").write_text('''# Third-party notes\n\nTI-JACK Android v0.16.1 currently uses:\n\n- `usb-serial-for-android` by mik3y, version 3.11.0, MIT licensed.\n- Android SDK / Kotlin / Gradle components under their respective licenses.\n\nThe v0.16 experiment compiled the MIT-licensed `tivars_lib_cpp` conversion engine into the APK for legacy TI file conversion. After that APK triggered a Google Play Protect harmful-app warning on test hardware, v0.16.1 removes the native converter from the Android package while a non-native conversion path is developed. The project history retains the experiment and attribution.\n\nThe Evo USB wire behavior was independently implemented in Kotlin from observed public protocol behavior. The Android project does not contain or redistribute the `evo_usb_py` Python source.\n\nTI-JACK is an unofficial utility and is not affiliated with or endorsed by Texas Instruments.\n''')
          PY

          git rm -f app/src/main/java/com/tijack/evo/LegacyTiConverter.kt
          git rm -f app/src/main/cpp/CMakeLists.txt app/src/main/cpp/tijack_converter.cpp
          rm -f .github/workflows/hotfix-v0161-play-protect.yml

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Android v0.16.1 remove native converter after Play Protect warning"
          git push
