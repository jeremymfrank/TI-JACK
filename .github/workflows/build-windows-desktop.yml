name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/build-windows-desktop.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop/windows/TIJack.Desktop/TIJack.Desktop.csproj

      - name: Publish Windows x64
        run: >
          dotnet publish desktop/windows/TIJack.Desktop/TIJack.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TI-JACK-Windows-v0.1
          path: desktop/windows/TIJack.Desktop/bin/Release/net8.0-windows/win-x64/publish/*
