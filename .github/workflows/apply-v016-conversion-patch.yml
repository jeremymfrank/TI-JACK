name: Apply v0.16 conversion integration

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/apply_v016_conversion_patch.py"
      - ".github/workflows/apply-v016-conversion-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 tools/apply_v016_conversion_patch.py

      - name: Commit patched activity
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tijack/evo/MainActivity.kt
          git commit -m "Wire legacy and image conversion into Android transfer"
          git push
